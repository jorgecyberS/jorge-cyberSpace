<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorge CyberSpace</title>
  <style>
    /* Estilos generales */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
    }

    /* Barra de navegación */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1e1e1e;
      padding: 12px 24px;
      border-bottom: 1px solid #333;
    }

    /* Enlaces de navegación principales */
    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      color: #e0e0e0;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #00adb5;
    }

    /* Contenedor del buscador y lupa */
    .search-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    .search-input:focus {
      border-color: #00adb5;
    }

    .search-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <header class="navbar">
    <nav>
      <ul class="nav-links">
        <li><a href="#emuladores">Emuladores</a></li>
        <li><a href="#consolas">Consolas</a></li>
        <li><a href="#moviles">Móviles</a></li>
        <li><a href="#juegos">Juegos</a></li>
        <li><a href="#minecraft">Minecraft</a></li>
        <li><a href="#extras">Extras</a></li>
      </ul>
    </nav>

    <!-- Buscador a la derecha -->
    <div class="search-container">
      <input type="text" id="inputBuscar" class="search-input" placeholder="Buscar...">
      <button id="btnLupa" class="search-btn">🔍</button>
    </div>
  </header>

</body>
</html>
